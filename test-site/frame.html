<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Iframe signup</title>
<style>
  :root { color-scheme: light dark; --card:#fff; --fg:#1d1d1f; --line:#d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --card:#1f2023; --fg:#ececef; --line:#3a3b40; } }
  body { margin: 0; padding: 12px 14px; background: var(--card); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
</style></head>
<body><form onsubmit="return false"><label for="f">Email</label><input type="email" id="f" name="email" autocomplete="email"></form></body></html>
