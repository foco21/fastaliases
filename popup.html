<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aliases for Fastmail</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <button class="round" id="settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="site" id="site"></div>
    <button class="pill" id="create">Create alias</button>
  </header>

  <section class="card prefix-card">
    <label for="prefix">Prefix</label>
    <input id="prefix" spellcheck="false" autocomplete="off" placeholder="optional">
  </section>

  <section class="card preview" id="preview" aria-live="polite">
    <div class="caption" id="caption">You're about to create</div>
    <div class="address mono" id="address"></div>
  </section>

  <label class="card switch-row" id="site-row" hidden>
    <span id="site-row-text">Show the @ button on this site</span>
    <input type="checkbox" id="site-toggle" role="switch">
  </label>

  <div class="status" id="status" role="alert"></div>

  <h2 id="list-title" hidden>Your aliases</h2>
  <ul id="aliases" aria-labelledby="list-title"></ul>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body></html>
